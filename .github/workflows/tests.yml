name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install age (real encryption tests; skipped where unavailable)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -ra tests

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: python -B -m unittest discover -s tests -v
        working-directory: research/adaptive_polling
