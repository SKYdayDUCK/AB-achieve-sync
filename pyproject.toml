[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-achieve-sync"
version = "1.2.0"
description = "Single-producer single-consumer crash-recoverable archive synchronization"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SKYdayDUCK"}]
keywords = ["ssh", "sync", "archive", "age", "backup", "image-transfer"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/SKYdayDUCK/AB-achieve-sync"
Issues = "https://github.com/SKYdayDUCK/AB-achieve-sync/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aas-a = "aas.cli:main_a"
aas-b = "aas.cli:main_b"
aasctl-shell = "aas.cli:main_shell"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
